# Push a tag like v0.2.0 (matching "version" in src-tauri/tauri.conf.json) to build, sign and publish a release.
# The installed app reads latest.json from the newest release to find updates.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: --target aarch64-apple-darwin # Apple silicon
          - args: --target x86_64-apple-darwin # Intel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: pnpm install --frozen-lockfile

      # yt-dlp and ffmpeg are bundled into the app, so each release ships the newest yt-dlp
      - run: ./scripts/fetch-binaries.sh

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Palms v__VERSION__
          releaseBody: See the assets below to download and install this version.
          # published, not a draft: the app only sees the latest published release
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
