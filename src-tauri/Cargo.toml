[package]
name = "palms"
version = "0.1.0"
description = "Scrape SoundCloud likes / YouTube playlists into Spotify local files"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "palms_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tokio = { version = "1.53.3", features = ["process", "io-util", "macros", "time", "sync"] }
id3 = "1.17.2"
dirs = "7.0.0"
urlencoding = "2.1.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
base64 = "0.23.1"
trash = "5.2.9"
tauri-plugin-process = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
